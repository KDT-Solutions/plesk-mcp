services:
  plesk-mcp:
    # Fertiges Image aus der GitHub Container Registry - wird per GitHub
    # Actions bei jedem Push auf main automatisch gebaut und veroeffentlicht
    # (.github/workflows/docker-publish.yml). Ist das GHCR-Package privat,
    # braucht Portainer unter "Registries" einen ghcr.io-Eintrag mit einem
    # GitHub Personal Access Token (Scope "read:packages").
    image: ghcr.io/kdt-solutions/plesk-mcp:latest
    # Bei jedem Deploy/Redeploy das Image aus der Registry neu ziehen, statt
    # eine lokal schon vorhandene (evtl. veraltete) :latest-Kopie zu verwenden.
    pull_policy: always
    container_name: plesk-mcp-cloud
    restart: unless-stopped
    environment:
      - PLESK_SSH_HOST=${PLESK_SSH_HOST}
      - PLESK_SSH_PORT=${PLESK_SSH_PORT:-22}
      - PLESK_SSH_USER=${PLESK_SSH_USER:-root}
      - PLESK_SSH_PASSWORD=${PLESK_SSH_PASSWORD}
      - PLESK_SSH_KEY_PATH=${PLESK_SSH_KEY_PATH:-}
      - PLESK_SSH_TIMEOUT=${PLESK_SSH_TIMEOUT:-20}
      - PLESK_SSH_KNOWN_HOSTS=${PLESK_SSH_KNOWN_HOSTS:-}
      - PLESK_SSH_HOST_KEY=${PLESK_SSH_HOST_KEY:-}
      - PLESK_API_HOST=${PLESK_API_HOST:-}
      - PLESK_API_PORT=${PLESK_API_PORT:-8443}
      - PLESK_API_KEY=${PLESK_API_KEY:-}
      - PLESK_API_VERIFY_SSL=${PLESK_API_VERIFY_SSL:-true}
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - PAGESPEED_TIMEOUT=${PAGESPEED_TIMEOUT:-120}
      - WP_CLI_PATH=${WP_CLI_PATH:-/usr/local/bin/wp-standalone}
      - WP_CLI_TIMEOUT=${WP_CLI_TIMEOUT:-120}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-26214400}
      - UPLOAD_RATE_LIMIT_PER_MIN=${UPLOAD_RATE_LIMIT_PER_MIN:-20}
      - UPLOAD_MAX_CONCURRENT=${UPLOAD_MAX_CONCURRENT:-2}
      - UPLOAD_MIN_FREE_MB=${UPLOAD_MIN_FREE_MB:-256}
      - UPLOAD_TIMEOUT=${UPLOAD_TIMEOUT:-300}
      - UPLOAD_TRUSTED_PROXIES=${UPLOAD_TRUSTED_PROXIES:-}
      - FETCH_TIMEOUT=${FETCH_TIMEOUT:-120}
      - VHOST_TRASH_MAX_MB=${VHOST_TRASH_MAX_MB:-500}
      - REPLACE_MAX_BYTES=${REPLACE_MAX_BYTES:-5242880}
      - PLESK_HOSTING_TIMEOUT=${PLESK_HOSTING_TIMEOUT:-180}
      - PHP_SETTINGS_ALLOWLIST=${PHP_SETTINGS_ALLOWLIST:-}
      - VHOST_TRASH_AUTOCLEAN_DAYS=${VHOST_TRASH_AUTOCLEAN_DAYS:-0}
      - IMAGE_JPEGOPTIM=${IMAGE_JPEGOPTIM:-/usr/bin/jpegoptim}
      - IMAGE_OPTIPNG=${IMAGE_OPTIPNG:-/usr/bin/optipng}
      - IMAGE_OPT_TIMEOUT=${IMAGE_OPT_TIMEOUT:-300}
      - IMAGE_OPT_TIME_BUDGET=${IMAGE_OPT_TIME_BUDGET:-30}
      - IMAGE_OPT_TOOL_TIMEOUT=${IMAGE_OPT_TOOL_TIMEOUT:-15}
      - IMAGE_OPT_BG_TOOL_TIMEOUT=${IMAGE_OPT_BG_TOOL_TIMEOUT:-300}
      - PLESK_HELPER_PYTHON=${PLESK_HELPER_PYTHON:-/usr/libexec/platform-python}
      - PLESK_HELPER_TIMEOUT=${PLESK_HELPER_TIMEOUT:-600}
      - AUDIT_LOG_FILE=${AUDIT_LOG_FILE:-}
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Auf allen Interfaces gebunden (Standard wie bei allen MCP-Stacks), damit
      # NPM den Dienst ueber <Host-IP>:8422 erreicht. Die Zugriffskontrolle ist das
      # Bearer-Token, TLS macht der Reverse-Proxy. Ueber MCP_BIND_ADDR einschraenkbar.
      - "${MCP_BIND_ADDR:-0.0.0.0}:${MCP_HOST_PORT:-8422}:8000"
