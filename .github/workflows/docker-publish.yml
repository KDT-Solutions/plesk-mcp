name: Docker Image bauen und veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "server.py"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Volle Historie, damit die Patch-Version (Anzahl Commits) stimmt
          fetch-depth: 0

      - name: Version ermitteln
        id: version
        run: |
          base=$(sed -n 's/^_VERSION_BASE = "\(.*\)"$/\1/p' server.py)
          # Patch = Commits seit dem Commit, der _VERSION_BASE zuletzt geaendert hat
          base_commit=$(git log -1 --format=%H -G '^_VERSION_BASE = "' -- server.py)
          count=$(git rev-list --count "${base_commit}..HEAD" -- server.py Dockerfile requirements.txt .github/workflows/docker-publish.yml)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
          echo "Version: ${base}.${count}"

      - name: Image-Namen in Kleinbuchstaben ermitteln
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx aufsetzen
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image bauen und pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
